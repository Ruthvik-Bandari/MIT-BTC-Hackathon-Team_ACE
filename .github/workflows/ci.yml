name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: apps/guardian-api

      - name: Lint
        run: bunx oxlint apps/
        continue-on-error: true

      - name: Type check
        run: bun run typecheck
        working-directory: apps/guardian-api
        continue-on-error: true
